# Project metadata and tool configuration.
#
# This is NOT an installable distribution: the sidecar is run from the checkout
# (./run.sh, `python -m g1acq serve`) or from the container image, because the
# mitmproxy addon entrypoint (g1_addon.py) lives at the repository root.
[project]
name = "g1-acq-clash"
version = "8.1.0"
description = "Google One iOS SKU rewrite sidecar for Clash / mihomo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mitmproxy>=12,<13", "segno>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: needs mitmdump/openssl (and mihomo for rule tests); skipped when missing",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow: the proxy catches broad exceptions on purpose so a
# single malformed response can never break the user's browsing.
select = ["E", "F", "I"]
ignore = ["E501"]
